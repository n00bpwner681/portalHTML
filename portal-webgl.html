<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X3D Portal Maker</title>
<style>
:root{--bg:#e6eaee;--panel:#f6f8fa;--ink:#18202c;--mute:#5d6a7a;--line:#cdd5de;--blue:#1f8fff;--orange:#ff8a1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 12px 0 0;display:flex;align-items:center;gap:8px}
.ring{width:14px;height:20px;border-radius:50%;border:3px solid var(--blue)}
.ring.o{border-color:var(--orange);margin-left:-10px}
header .sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.go{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;min-height:0}
aside{background:var(--panel);padding:12px;overflow:auto;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
aside h2{font-size:13px;margin:12px 0 6px}
aside h2:first-child{margin-top:0}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#list{display:flex;flex-direction:column;gap:4px}
#list button{text-align:left;padding:5px 8px}
#list button.on{border-color:var(--orange);background:#fff3e6}
label{display:block;margin-bottom:8px;color:var(--mute);font-size:13px}
label input,label select{display:block;width:100%;margin-top:2px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
label input[type=color]{height:32px;padding:2px}
.row{display:flex;gap:6px}.row button{flex:1}
.hint{color:var(--mute)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:10px;bottom:8px;color:var(--mute);font-size:12px;pointer-events:none;background:#ffffffc0;padding:3px 8px;border-radius:5px}
#hud{display:none}
body.playing #app>header,body.playing aside{display:none}
body.playing main{display:block}
body.playing #stage{position:fixed;inset:0;z-index:10;background:#000}
body.playing #hud{display:block}
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid #fff;border-radius:50%;mix-blend-mode:difference;pointer-events:none}
#exit{position:absolute;left:12px;top:12px}
#hset{position:absolute;left:78px;top:12px}
#settings{position:fixed;right:12px;top:56px;width:260px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 6px 24px #0003}
#settings .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#settings input[type=range]{padding:0}
#bossbar{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(520px,70vw);text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.bar{height:12px;background:#0007;border:1px solid #fff6;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#e5412d}
#hpbar{position:absolute;left:14px;bottom:14px;width:220px}#hpfill{background:#37c871!important}
#hurt{position:absolute;inset:0;background:radial-gradient(transparent 40%,#e5412d);opacity:0;pointer-events:none}
#card{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#000a}
#card[hidden]{display:none}
.cardin{background:var(--panel);max-width:520px;margin:16px;padding:24px;border-radius:10px}
.cardin h2{margin:0 0 10px}.cardin p{line-height:1.5;margin:0 0 16px}
#msg{max-width:80vw;text-align:center}
#msg{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#18202ccc;color:#fff;padding:6px 14px;border-radius:6px;pointer-events:none}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 34vh}#left{display:none}#right{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1><span class="ring"></span><span class="ring o"></span>X3D Portal Maker</h1>
  <label style="margin:0;display:flex;align-items:center;gap:6px">Snap
    <select id="snap" style="width:auto;margin:0"><option value="1">1 stud</option><option value="0.5" selected>0.5 stud</option><option value="0">Off</option></select>
  </label>
  <span class="sp"></span>
  <button id="reset">Reset level</button>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <button id="setbtn">Settings</button>
  <button id="storybtn" class="go">Story mode</button>
  <button id="pfbtn">Play from file</button>
  <input id="pfile" type="file" accept=".json,application/json" hidden>
  <button id="play" class="go">Play</button>
</header>
<main>
  <aside id="left">
    <h2>Add object</h2>
    <div class="add">
      <button data-add="block">Block</button><button data-add="white">Portal wall</button>
      <button data-add="spawn">Spawn</button><button data-add="goal">Goal</button>
    </div>
    <h2>Objects</h2>
    <div id="list"></div>
  </aside>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint"></div>
    <div id="hud"><div id="cross"></div><div id="hurt"></div><div id="bossbar" hidden><div id="bossname">WARDEN CORE</div><div class="bar"><i id="bossfill"></i></div></div><div id="hpbar" hidden><div class="bar"><i id="hpfill"></i></div></div><button id="exit">Exit</button><button id="hset">Settings</button><div id="msg"></div></div>
  </div>
  <aside id="right"></aside>
</main>
</div>
<div id="card" hidden><div class="cardin"><h2 id="ct"></h2><p id="cp"></p><button id="cb" class="go"></button></div></div>
<div id="settings" hidden><div class="sh"><b>Player settings</b><button id="sclose">Close</button></div><div id="sbody"></div><button id="sreset">Reset to defaults</button></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#c'),gl=cv.getContext('webgl',{antialias:true});
if(!gl){document.body.innerHTML='<p style="padding:2rem">WebGL is not available in this browser.</p>';throw new Error('no webgl')}

/* ---------- math ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)};
const clampR=(v,lo,hi)=>lo>hi?(lo+hi)/2:Math.min(hi,Math.max(lo,v));
function persp(f,a,n,fr){const t=1/Math.tan(f/2);return[t/a,0,0,0,0,t,0,0,0,0,(fr+n)/(n-fr),-1,0,0,2*fr*n/(n-fr),0]}
function look(e,c){const z=norm(sub(e,c)),x=norm(cross([0,1,0],z)),y=cross(z,x);
  return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]}
function mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o}
function basis(yaw,p){const cp=Math.cos(p),f=[-Math.sin(yaw)*cp,Math.sin(p),-Math.cos(yaw)*cp],r=[Math.cos(yaw),0,-Math.sin(yaw)];return{f,r,u:cross(r,f)}}
const FOV=1.0;

/* ---------- GL setup ---------- */
function prog(vs,fs){const p=gl.createProgram();[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]].forEach(([t,s])=>{const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(h));gl.attachShader(p,h)});gl.linkProgram(p);return p}
const P0=prog(`attribute vec3 p,n;uniform mat4 vp;uniform vec3 pos,sc;varying vec3 vn,vl,vw,vsc;
void main(){vn=n;vl=p;vsc=sc;vw=p*sc+pos;gl_Position=vp*vec4(vw,1.);}`,
`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec3 col,eye,pn,bmn[32],bmx[32];uniform float mt,t,nb,cpOn;uniform vec3 cpc,cpn;uniform vec2 res;uniform sampler2D rt;varying vec3 vn,vl,vw,vsc;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float sh(vec3 o,vec3 d){for(int i=0;i<32;i++){if(float(i)>=nb)break;vec3 a=(bmn[i]-o)/d,b=(bmx[i]-o)/d,t0=min(a,b),t1=max(a,b);
 float tn=max(max(t0.x,t0.y),t0.z),tf=min(min(t1.x,t1.y),t1.z);if(tf>max(tn,0.))return 0.;}return 1.;}
void main(){
 vec3 N=normalize(vn);
 if(mt<-.5){gl_FragColor=vec4(col,1.);return;}
 if(cpOn>.5&&mt<3.5&&dot(vw-cpc,cpn)<.02)discard;
 if(mt>4.5&&mt<5.5){gl_FragColor=vec4(col,1.);return;}
 if(mt>3.5&&mt<4.5){vec3 Lg=normalize(vec3(.4,.8,.6));vec3 c=pow(col,vec3(2.2))*(.4+.9*max(dot(N,Lg),0.))+pow(max(dot(N,normalize(Lg+vec3(0.,0.,1.))),0.),30.)*.25;
  gl_FragColor=vec4(pow(1.-exp(-c*1.2),vec3(.4545)),1.);return;}
 if(mt>2.5){
  if(dot(N,pn)<.5)discard;
  vec2 q=abs(pn.x)>.5?vec2(vl.z*vsc.z,vl.y*vsc.y):vec2(vl.x*vsc.x,vl.y*vsc.y);
  q/=vec2(.75,1.1);float r=length(q);if(r>1.)discard;
  float ring=smoothstep(.68,.93,r),sw=nz(q*3.+t*1.5)*.5+nz(q*7.-t)*.5;
  vec3 c=col*(ring*2.6+(1.-ring)*(.2+.55*sw));
  if(mt>5.5){vec3 inner=texture2D(rt,gl_FragCoord.xy/res).rgb+col*ring*.25;c=pow(col*ring*2.6,vec3(.4545));gl_FragColor=vec4(mix(inner,c,clamp(ring*1.3,0.,1.)),1.);return;}
  gl_FragColor=vec4(pow(c,vec3(.4545)),1.);return;}
 vec3 base=pow(col,vec3(2.2)),emis=vec3(0.);
 vec2 uv=N.y>.5?vw.xz:(abs(N.x)>.5?vw.zy:vw.xy);
 float nse=nz(uv*6.)*.5+nz(uv*23.)*.5,seam=1.,spec=.05;
 vec2 g=abs(fract(uv/2.)-.5);float gm=max(g.x,g.y);
 if(mt<.5){seam=1.-.5*smoothstep(.485,.5,gm);base*=.7+.55*nse;}
 else if(mt<1.5){seam=1.-.6*smoothstep(.48,.5,gm);base*=.9+.12*nse;spec=.4;}
 else{float st=step(.5,fract((uv.x+uv.y)*1.5-t*.3));emis=base*(.7+.5*st)*(.8+.2*sin(t*3.));base*=.4;}
 vec3 e=(.5-abs(vl))*vsc;
 float ed=abs(N.x)>.5?min(e.y,e.z):(abs(N.y)>.5?min(e.x,e.z):min(e.x,e.y));
 float ao=mix(.65,1.,smoothstep(0.,.3,ed));
 if(N.y<.5)ao*=mix(.6,1.,smoothstep(0.,2.,vw.y));
 vec3 L=normalize(vec3(.45,.9,.55)),V=normalize(eye-vw),H=normalize(L+V),o=vw+N*.03;
 float nl=max(dot(N,L),0.);
 float sd=(sh(o,L)+sh(o,normalize(L+vec3(.04,0.,-.03)))+sh(o,normalize(L+vec3(-.03,.02,.04))))/3.;
 vec3 sky=mix(vec3(.1,.11,.14),vec3(.45,.58,.8),N.y*.5+.5);
 vec3 lin=base*(sky*ao+vec3(1.,.93,.82)*2.2*nl*sd*mix(.7,1.,ao));
 lin+=vec3(1.,.95,.9)*pow(max(dot(N,H),0.),48.)*spec*sd*nl;
 lin=lin*seam+emis;
 vec3 c=pow(1.-exp(-lin*1.1),vec3(.4545));
 c=mix(c,vec3(.78,.85,.92),1.-exp(-length(eye-vw)*.012));
 gl_FragColor=vec4(c,1.);}`);
gl.useProgram(P0);
const U={};['vp','pos','sc','col','mt','eye','pn','t','nb','bmn','bmx','cpOn','cpc','cpn','res','rt'].forEach(k=>U[k]=gl.getUniformLocation(P0,k));
const A={p:gl.getAttribLocation(P0,'p'),n:gl.getAttribLocation(P0,'n')};
gl.enableVertexAttribArray(A.p);gl.enableVertexAttribArray(A.n);
gl.enable(gl.DEPTH_TEST);

function buf(type,data,Arr){const b=gl.createBuffer();gl.bindBuffer(type,b);gl.bufferData(type,new Arr(data),gl.STATIC_DRAW);return b}
// cube: 6 faces x 4 vertices (24) with 36 indices; each vertex = position + normal
const cv24=[],ci=[];
for(let a=0;a<3;a++)for(const s of[-1,1]){const u=(a+1)%3,v=(a+2)%3,base=cv24.length/6;
  for(const[du,dv]of[[-1,-1],[1,-1],[1,1],[-1,1]]){const p=[0,0,0],n=[0,0,0];p[a]=s*.5;p[u]=du*.5;p[v]=dv*.5;n[a]=s;cv24.push(...p,...n)}
  ci.push(base,base+1,base+2,base,base+2,base+3)}
const cubeVB=buf(gl.ARRAY_BUFFER,cv24,Float32Array),cubeIB=buf(gl.ELEMENT_ARRAY_BUFFER,ci,Uint16Array);
// edges of a unit cube (for selection) and a floor grid
const ed=[];for(let i=0;i<8;i++)for(const b of[1,2,4])if(!(i&b)){for(const j of[i,i|b])ed.push((j&1)-.5,((j>>1)&1)-.5,((j>>2)&1)-.5,0,1,0)}
const edgeVB=buf(gl.ARRAY_BUFFER,ed,Float32Array);
const gr=[];for(let k=-12;k<=12;k++){gr.push(k,.01,-12,0,1,0,k,.01,12,0,1,0,-12,.01,k,0,1,0,12,.01,k,0,1,0)}
const gridVB=buf(gl.ARRAY_BUFFER,gr,Float32Array);
function bindV(b){gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.vertexAttribPointer(A.p,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(A.n,3,gl.FLOAT,false,24,12)}
function setU(p,s,c,l){gl.uniform3fv(U.pos,p);gl.uniform3fv(U.sc,s);gl.uniform3fv(U.col,c);gl.uniform1f(U.mt,l)}
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);

/* ---------- level data ---------- */
// y is the BOTTOM of an object, so anything with y=0 rests on the floor.
const T={
  block:{name:'Block',c:'#8b95a1',s:[2,2,2],solid:1},
  white:{name:'Portal wall',c:'#f1f4f7',s:[4,4,1],solid:1},
  spawn:{name:'Spawn',c:'#2ea8ff',s:[1,.1,1],solid:0},
  goal:{name:'Goal',c:'#3ec46d',s:[2,.2,2],solid:0}};
let objs=[],sel=null,nid=1,mode='edit';
function mk(type,o){const t=T[type];return Object.assign({id:nid++,type,x:0,y:0,z:0,w:t.s[0],h:t.s[1],d:t.s[2],c:t.c},o)}
function defaultLevel(){nid=1;return[
  mk('block',{y:-1,w:24,h:1,d:24,c:'#aab3bd'}),
  mk('white',{z:-11.5,w:24,h:6,d:1}),mk('white',{z:11.5,w:24,h:6,d:1}),
  mk('block',{x:-11.5,w:1,h:6,d:22,c:'#8b95a1'}),mk('block',{x:11.5,w:1,h:6,d:22,c:'#8b95a1'}),
  mk('white',{w:12,h:6,d:1}),mk('block',{x:6,z:-4,w:3,h:1,d:3,c:'#7d8995'}),
  mk('block',{x:-6,z:5,w:1.5,h:1.5,d:1.5,c:'#b08a5a'}),mk('block',{x:-4.5,z:5.5,w:1,h:1,d:1,c:'#a07a4c'}),mk('block',{x:-9,z:-6,w:1.5,h:6,d:1.5,c:'#6f7a86'}),mk('block',{x:9,z:-6,w:1.5,h:6,d:1.5,c:'#6f7a86'}),
  mk('spawn',{z:8}),mk('goal',{z:-8})]}
function clean(a){if(!Array.isArray(a))return null;const out=a.filter(o=>o&&T[o.type]).map(o=>{const n=x=>isFinite(+x)?+x:0,s=x=>Math.max(.1,isFinite(+x)?+x:1);
  return{id:0,type:o.type,x:n(o.x),y:n(o.y),z:n(o.z),w:s(o.w),h:s(o.h),d:s(o.d),c:/^#[0-9a-f]{6}$/i.test(o.c)?o.c:T[o.type].c}});
  out.forEach((o,i)=>o.id=i+1);nid=out.length+1;return out.length?out:null}
function save(){try{localStorage.setItem('x3d-portal-level',JSON.stringify(objs))}catch(e){}}
function loadSaved(){try{return clean(JSON.parse(localStorage.getItem('x3d-portal-level')))}catch(e){return null}}
objs=loadSaved()||defaultLevel();

/* ---------- player settings ---------- */
const SD={speed:6,jump:8,grav:22,fov:70,sens:1,gun:1};
const S=Object.assign({},SD,(()=>{try{return JSON.parse(localStorage.getItem('x3d-portal-settings'))||{}}catch(e){return{}}})());
for(const k in SD)if(!isFinite(+S[k]))S[k]=SD[k];
const saveS=()=>{try{localStorage.setItem('x3d-portal-settings',JSON.stringify(S))}catch(e){}};
const SF=[['speed','Move speed',2,14,.5],['jump','Jump strength',3,14,.5],['grav','Gravity',10,40,1],['fov','Field of view',60,110,1],['sens','Look sensitivity',.3,3,.1]];
function buildSettings(){const b=$('#sbody');
  b.innerHTML=SF.map(([k,l,mn,mx,st])=>`<label>${l}: <b id="v-${k}">${S[k]}</b><input type="range" data-s="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"></label>`).join('')
   +`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-gun" ${S.gun?'checked':''} style="width:auto;margin:0"> Show portal gun</label>`;
  b.querySelectorAll('[data-s]').forEach(i=>{i.oninput=()=>{S[i.dataset.s]=+i.value;$('#v-'+i.dataset.s).textContent=i.value;saveS()};i.onchange=()=>i.blur()});
  $('#s-gun').onchange=e=>{S.gun=e.target.checked?1:0;saveS();e.target.blur()}}
const togS=()=>{$('#settings').hidden=!$('#settings').hidden};
$('#setbtn').onclick=togS;$('#hset').onclick=togS;$('#sclose').onclick=()=>{$('#settings').hidden=true};
$('#sreset').onclick=()=>{Object.assign(S,SD);saveS();buildSettings()};

/* ---------- editor UI ---------- */
const snapV=()=>parseFloat($('#snap').value)||0;
const snap=v=>snapV()?Math.round(v/snapV())*snapV():v;
const cur=()=>objs.find(o=>o.id===sel);
function select(id){sel=id;list();inspect()}
function list(){const l=$('#list');l.innerHTML=objs.map((o,i)=>`<button data-id="${o.id}" class="${o.id===sel?'on':''}">${i+1}. ${T[o.type].name}</button>`).join('');
  l.querySelectorAll('button').forEach(b=>b.onclick=()=>select(+b.dataset.id))}
function inspect(){const r=$('#right'),o=cur();
  if(!o){r.innerHTML='<p class="hint">Select an object from the list, or click it in the view.</p>';return}
  r.innerHTML=`<label>Type<select id="f-type">${Object.keys(T).map(k=>`<option value="${k}"${k===o.type?' selected':''}>${T[k].name}</option>`).join('')}</select></label>`
  +[['x','X'],['y','Y (bottom)'],['z','Z'],['w','Width'],['h','Height'],['d','Depth']].map(([k,l])=>`<label>${l}<input type="number" step="0.5" data-k="${k}" value="${+o[k].toFixed(3)}"></label>`).join('')
  +`<label>Colour<input type="color" id="f-c" value="${o.c}"></label><div class="row"><button id="dup">Duplicate</button><button id="del">Delete</button></div>`;
  r.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{const v=parseFloat(i.value);if(!isFinite(v))return;o[i.dataset.k]='whd'.includes(i.dataset.k)?Math.max(.1,v):v;save()});
  $('#f-c').oninput=e=>{o.c=e.target.value;save()};
  $('#f-type').onchange=e=>{o.type=e.target.value;save();list()};
  $('#dup').onclick=dup;$('#del').onclick=del}
function add(type){const g=planeHit({o:cam.p,d:basis(cam.yaw,cam.pitch).f},0)||[0,0,0];const o=mk(type,{x:snap(g[0]),z:snap(g[2])});objs.push(o);save();select(o.id)}
function dup(){const o=cur();if(!o)return;const n=Object.assign({},o,{id:nid++,x:o.x+1,z:o.z+1});objs.push(n);save();select(n.id)}
function del(){objs=objs.filter(o=>o.id!==sel);sel=null;save();list();inspect()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
let rt=null;

   Bk({x:7,z:-8,w:10,h:5,d:10,c:'#7d8995'}),Bk({x:-3,z:-4,w:2,h:3,d:6,c:'#6f7a86'}),mk('goal',{x:7,y:5,z:-8}),mk('spawn',{x:-6,z:10})]}},
 {boss:1,line:'WARDEN: I rebuilt the arena just for you. Try not to get hit. (Hint: send the red orbs through a portal and back at the Core.)',
  build:()=>{nid=1;return[Bk({y:-1,w:32,h:1,d:32,c:'#aab3bd'}),Wl({z:-16.5,w:34,h:12}),Wl({z:16.5,w:34,h:12}),Wl({x:-16.5,w:1,h:12,d:32}),Wl({x:16.5,w:1,h:12,d:32}),
   Bk({x:-6,z:2,w:2,h:3.5,d:2,c:'#6f7a86'}),Bk({x:6,z:2,w:2,h:3.5,d:2,c:'#6f7a86'}),mk('spawn',{z:13})]}}];
function startStory(){if(!backup)backup=objs;story={i:0};
  showCard('Meridian Test Facility','You wake on a cold floor. A calm voice fills the room: "Welcome back, Subject 17. The portal device in your hand is on loan. Please do not break it, or yourself." Reach the green pad in each chamber. Left click fires blue, right click or E fires orange.','Begin',()=>loadStage(0))}
function loadStage(i){story.i=i;objs=STORY[i].build();sel=null;startPlay();say(STORY[i].line,9000);
  if(STORY[i].boss){boss={x:0,y:4.5,z:-12,hp:100,t:0,cool:3,flash:0,tele:0,ph:0,dead:false};$('#bossbar').hidden=false;$('#hpbar').hidden=false}}
function storyGoal(){const st=STORY[story.i],n=story.i+1;showCard(st.done[0],st.done[1],st.done[2],()=>loadStage(n))}
$('#storybtn').onclick=startStory;
function orbStep(o,dt){o.age+=dt;o.cd=Math.max(0,o.cd-dt);
  if(o.refl){const sp=Math.hypot(...o.v),tb=norm(sub([boss.x,boss.y,boss.z],o.p));o.v=norm(o.v.map((v,i)=>v+(tb[i]*sp-v)*Math.min(1,dt*2.5))).map(v=>v*sp)}
  o.p=o.p.map((v,i)=>v+o.v[i]*dt);
  if(o.cd<=0&&portals[0]&&portals[1])for(const i of[0,1]){const a=portals[i],b=portals[1-i],d=sub(o.p,a.c),dn=d[0]*a.n[0]+d[2]*a.n[2];
    if(dn>-.3&&dn<.7&&Math.abs(-d[0]*a.n[2]+d[2]*a.n[0])<.9&&Math.abs(d[1])<1.3&&o.v[0]*a.n[0]+o.v[2]*a.n[2]<0){
      const D=Math.atan2(-b.n[0],-b.n[2])-Math.atan2(a.n[0],a.n[2]),c=Math.cos(D),s=Math.sin(D);
      o.v=[o.v[0]*c+o.v[2]*s,o.v[1],o.v[2]*c-o.v[0]*s];o.p=[b.c[0]+b.n[0]*.8,b.c[1]+d[1],b.c[2]+b.n[2]*.8];o.refl=true;o.cd=.3;break}}
  for(const w of solids()){const mn=bmin(w),mx=bmax(w);
    if(o.p[0]>mn[0]-.25&&o.p[0]<mx[0]+.25&&o.p[1]>mn[1]-.25&&o.p[1]<mx[1]+.25&&o.p[2]>mn[2]-.25&&o.p[2]<mx[2]+.25)return false}
  if(!o.refl){if(Math.hypot(o.p[0]-P.x,o.p[2]-P.z)<.75&&o.p[1]>P.y-.2&&o.p[1]<P.y+2){P.hp-=15;P.hit=0;P.hurt=1;return false}}
  else if(Math.hypot(...sub(o.p,[boss.x,boss.y,boss.z]))<1.9){boss.hp-=18;boss.flash=.25;return false}
  return o.age<12}
function bossStep(dt){const B=boss;
  P.hit+=dt;P.hurt=Math.max(0,P.hurt-dt*2);if(P.hit>3)P.hp=Math.min(100,P.hp+4*dt);
  $('#hurt').style.opacity=P.hurt;$('#hpfill').style.width=Math.max(0,P.hp)+'%';$('#bossfill').style.width=Math.max(0,B.hp)+'%';
  if(B.dead)return;
  B.t+=dt;B.flash=Math.max(0,B.flash-dt);B.x=Math.sin(B.t*.6)*7;B.y=4.5+Math.sin(B.t*1.3)*.3;
  const ph=B.hp>66?0:B.hp>33?1:2;
  if(ph!==B.ph){B.ph=ph;say(ph===1?'WARDEN: Interesting. A hit. I am now significantly less bored.':'WARDEN: Stop that! Stop redirecting my science!',5000)}
  B.cool-=dt;B.tele=B.cool<.45?1:0;
  if(B.cool<=0){B.cool=[2.2,1.7,1.3][ph];const sp=[9,11,13][ph],o0=[B.x,B.y,B.z+1.4],d=norm(sub([P.x,P.y+1.2,P.z],o0));
    for(const a of ph===0?[0]:ph===1?[-.14,.14]:[-.22,0,.22]){const c=Math.cos(a),s=Math.sin(a);orbs.push({p:o0.slice(),v:[(d[0]*c+d[2]*s)*sp,d[1]*sp,(d[2]*c-d[0]*s)*sp],refl:false,cd:0,age:0})}}
  orbs=orbs.filter(o=>orbStep(o,dt));
  if(B.hp<=0&&!B.dead){B.dead=true;orbs=[];say('WARDEN: No... not like this...',4000);
    setTimeout(()=>{if(story&&boss&&boss.dead)showCard('The Core falls','The casing cracks and the arena lights go quiet. A last, tired voice: "Congratulations, Subject 17. You were never the test. I was." The exit doors grind open, and daylight spills across the floor.','Back to editor',stopPlay)},2200);return}
  if(P.hp<=0&&!P.dead){P.dead=true;showCard('You were vaporised','WARDEN: "Please try to be harder to hit."','Try again',()=>loadStage(story.i))}}

let last=performance.now();
function frame(t){requestAnimationFrame(frame);const dt=(t-last)/1000;last=t;fit();if(mode==='play'){if(!paused){step(dt);if(boss)bossStep(Math.min(dt,.05))}}else flyStep(Math.min(dt,.05));render()}
function flyStep(dt){if(!flying)return;const b=basis(cam.yaw,cam.pitch),sp=(keys.ShiftLeft||keys.ShiftRight?30:10)*dt,mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0),my=(keys.KeyE?1:0)-(keys.KeyQ?1:0);
  for(let i=0;i<3;i++)cam.p[i]+=(b.f[i]*mz+b.r[i]*mx)*sp+(i===1?my*sp:0)}
buildSettings();list();inspect();setHint();setMsg('');requestAnimationFrame(frame);
</script>
